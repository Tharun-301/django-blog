{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">
  <!-- Left Sidebar -->
   <!-- load side bar  -->
    {% include 'dashboard/sidebar.html' %}


  <!-- Rigth Sidebar content -->
   <div class="col-md-9">
    {% if perms.auth.add_user %}
    <h2>Add New User</h2>
    <form action="{% url 'add_user' %}" method="POST" >
      {% csrf_token %}
      {{ form | crispy }}
      <button class="btn btn-warning " type="submit">Submit</button>
    </form>
    <br>
    {% else %}
    <h3>You do not have permission to add this page</h3>
    {% endif %}
    </div>
</div>

{% endblock %}
